<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stars Thread Monitor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--acc:#2563eb;--track:#e5e7eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--muted:#9aa3b2;--line:#262a33;--track:#2a2f3a}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--muted:#9aa3b2;--line:#262a33;--track:#2a2f3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.sub{color:var(--muted);font-size:12px}.grid{display:grid;gap:12px}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.gauge{display:flex;flex-direction:column;align-items:center}.gauge svg{width:130px;height:80px;overflow:visible}
.gauge .v{font-size:22px;font-weight:600;margin-top:-30px}.gauge .l{font-size:12px;color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.bar{height:12px;background:var(--track);border-radius:6px;overflow:hidden;grid-column:1/-1}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .6s}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 12px;font-size:12px;color:var(--muted)}.kv b{color:var(--fg);font-weight:600}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.running{color:var(--ok);border-color:var(--ok)}.pill.stalled,.pill.paused{color:var(--warn);border-color:var(--warn)}.pill.done{color:var(--acc);border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:3px}.cores i{display:block;height:28px;border-radius:3px;background:var(--track);position:relative;overflow:hidden}.cores i b{position:absolute;bottom:0;left:0;right:0;background:var(--acc)}
.ev{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;color:var(--muted);max-height:180px;overflow:auto}
.stale{color:var(--bad)}
</style>
</head>
<body>
<h1>SDSS–DESI stars thread: steps monitor <span id="host" class="sub"></span></h1>
<div class="sub" id="meta">waiting for status.json …</div>

<h2>Resources</h2>
<div class="grid g5" id="gauges"></div>
<div class="card" style="margin-top:12px"><div class="sub" style="margin-bottom:6px">CPU per core (<span id="ncpu"></span>)</div><div class="cores" id="cores"></div></div>

<h2>Steps</h2>
<div class="grid" id="steps"></div>

<h2>Workers <span id="guard" class="sub"></span></h2>
<div class="card"><table id="workers"><thead><tr><th>pid</th><th>step</th><th>shard</th><th>state</th><th>CPU %</th><th>RSS GB</th><th>age</th></tr></thead><tbody></tbody></table></div>

<h2>Disks</h2>
<div class="grid g5" id="disks"></div>

<h2>Events</h2>
<div class="card ev" id="events">—</div>

<script>
const $=s=>document.querySelector(s);
function color(p,warn,bad){return p>=bad?'var(--bad)':p>=warn?'var(--warn)':'var(--ok)'}
function gauge(label,val,txt,warn,bad){const p=Math.max(0,Math.min(100,val||0));const r=52,c=Math.PI*r,o=c*(1-p/100);
 return `<div class="card gauge"><svg viewBox="0 0 130 80"><path d="M13 70 A52 52 0 0 1 117 70" fill="none" stroke="var(--track)" stroke-width="12" stroke-linecap="round"/>
 <path d="M13 70 A52 52 0 0 1 117 70" fill="none" stroke="${color(p,warn,bad)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>
 <div class="v">${txt}</div><div class="l">${label}</div></div>`}
function fmtMin(m){if(m==null||!isFinite(m))return '—';if(m<90)return m.toFixed(0)+' min';const h=m/60;return h<48?h.toFixed(1)+' h':(h/24).toFixed(1)+' d'}
async function tick(){try{const s=await (await fetch('status.json?'+Date.now())).json();render(s)}catch(e){$('#meta').innerHTML='<span class="stale">status.json unavailable: '+e+'</span>'}}
function render(s){const sys=s.system;$('#host').textContent='· '+s.host;
 const age=(Date.now()-new Date(s.time.replace(' ','T')).getTime())/1000;
 $('#meta').innerHTML=`updated ${s.time} ${age>3*s.interval?'<span class="stale">(stale, '+age.toFixed(0)+' s ago — is the monitor running?)</span>':''} · ${s.n_workers} worker(s)${s.n_paused?', <span class="stale">'+s.n_paused+' paused by guard</span>':''}`;
 const mem=sys.mem_pct, g=[gauge('CPU total',sys.cpu_total,sys.cpu_total.toFixed(0)+'%',75,92),
  gauge(`memory used of ${sys.mem_total_gb.toFixed(0)} GB`,mem,sys.mem_used_gb.toFixed(1)+' GB',75,88),
  gauge('memory available',100-100*sys.mem_available_gb/sys.mem_total_gb,sys.mem_available_gb.toFixed(1)+' GB',75,88),
  gauge('swap in use',Math.min(100,sys.swap_used_gb/8*100),sys.swap_used_gb.toFixed(1)+' GB',40,75),
  gauge('disk read',Math.min(100,sys.disk_read_mbs/300*100),sys.disk_read_mbs.toFixed(0)+' MB/s',200,300),
  gauge('load (1 min) / cores',100*sys.load1/sys.ncpu,sys.load1.toFixed(1),80,100)];
 $('#gauges').innerHTML=g.join('');$('#ncpu').textContent=sys.ncpu+' cores';
 $('#cores').innerHTML=sys.cpu_per_core.map(p=>`<i title="${p.toFixed(0)}%"><b style="height:${p}%;background:${color(p,80,95)}"></b></i>`).join('');
 $('#steps').innerHTML=s.steps.map(st=>`<div class="card"><div class="step"><div><b>${st.name}</b> <span class="pill ${st.status}">${st.status}</span></div>
  <div><b>${st.pct.toFixed(1)}%</b> <span class="sub">${st.done.toLocaleString()} / ${st.total.toLocaleString()}</span></div>
  <div class="bar"><i style="width:${st.pct}%;background:${st.status==='done'?'var(--acc)':st.status==='stalled'?'var(--warn)':'var(--acc)'}"></i></div></div>
  <div class="kv" style="margin-top:8px"><span>rate <b>${st.rate_per_min?st.rate_per_min.toFixed(1)+' /min':'—'}</b></span><span>ETA <b>${fmtMin(st.eta_min)}</b> ${st.eta_at?'<span class="sub">('+st.eta_at+')</span>':''}</span>
  <span>elapsed <b>${fmtMin(st.elapsed_min)}</b></span><span>started <b>${st.started||'—'}</b></span><span>last file <b>${st.last_update||'—'}</b></span></div></div>`).join('');
 $('#guard').textContent=s.guard.enabled?`· guard on: pause if available memory < ${s.guard.mem_pause_gb} GB or swap > ${s.guard.swap_pause_gb} GB, or CPU > ${s.guard.cpu_pause_pct}% sustained; resume at ${s.guard.mem_resume_gb} GB / ${s.guard.cpu_resume_pct}%`:'· guard off';
 $('#workers tbody').innerHTML=s.workers.length?s.workers.map(w=>`<tr><td>${w.pid}</td><td>${w.step}</td><td>${w.shard}</td><td><span class="pill ${w.state}">${w.state}</span></td><td>${w.cpu.toFixed(0)}</td><td>${w.rss_gb.toFixed(2)}</td><td>${fmtMin(w.age_min)}</td></tr>`).join(''):'<tr><td colspan="7" class="sub">no workers running</td></tr>';
 $('#disks').innerHTML=Object.entries(s.disks).map(([k,d])=>d.missing?`<div class="card gauge"><div class="v stale">—</div><div class="l">${k}<br>not mounted</div></div>`:gauge(`${k}<br>${d.free_gb.toFixed(0)} GB free`,d.used_pct,d.used_pct.toFixed(0)+'%',90,97)).join('');
 $('#events').textContent=s.events.length?s.events.map(e=>e.t+'  '+e.msg).join('\n'):'no events';
}
tick();setInterval(tick,10000);
</script>
</body>
</html>
