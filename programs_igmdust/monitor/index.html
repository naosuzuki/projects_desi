<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>igmdust monitor</title>
<style>
  :root {
    --bg: #0e1420; --card: #17202f; --ink: #e8edf5; --dim: #8b98ab;
    --ok: #4cc38a; --run: #4ea1f7; --warn: #e5a50a; --edge: #27354a;
    --fail: #e0453f;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --dim:#5d6b7e;
            --edge:#dde4ee; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: 24px 16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 26px 0 10px; color: var(--dim);
       text-transform: uppercase; letter-spacing: .06em; }
  .sub { color: var(--dim); margin-bottom: 8px; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--edge);
          border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .row b { font-size: 14px; }
  .state { font-size: 11px; padding: 1px 9px; border-radius: 999px;
           font-weight: 600; white-space: nowrap; }
  .s-done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .s-run  { background: color-mix(in srgb, var(--run) 18%, transparent); color: var(--run); }
  .s-wait { background: color-mix(in srgb, var(--dim) 18%, transparent); color: var(--dim); }
  .s-fail { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }
  .pct { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 6px; background: var(--edge);
         margin: 8px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 6px;
           transition: width .6s; }
  .detail { font-size: 12.5px; color: var(--dim); }
  .hostgrid { display: grid; gap: 10px;
              grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .mini { font-size: 12px; color: var(--dim); display: flex;
          justify-content: space-between; margin-top: 7px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--edge); }
  th { color: var(--dim); font-weight: 600; }
  .foot { margin-top: 20px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>igmdust — pipeline monitor</h1>
  <div class="sub">DESI &times; Legacy Surveys &times; DES circumgalactic
    dust &mdash; updated <b id="when">&hellip;</b></div>

  <h2>Pipeline</h2>
  <div id="jobs"></div>

  <h2>Hosts</h2>
  <div class="hostgrid" id="hosts"></div>

  <h2>Latest results</h2>
  <div class="card"><table id="results"></table></div>

  <div class="foot">Auto-refreshes every 5 min (data regenerated every
    ~3 min). Static page; no cookies, no external assets.</div>
</div>
<script>
const COLOR = {done: "var(--ok)", run: "var(--run)",
               wait: "var(--dim)", fail: "var(--fail)"};
const LABEL = {done: "DONE", run: "RUNNING", wait: "QUEUED", fail: "CHECK"};
function jobCard(g) {
  const pct = Math.max(0, Math.min(100, g.pct));
  return `<div class="card">
    <div class="row"><b>${g.name}</b>
      <span class="state s-${g.state}">${LABEL[g.state] || "?"}</span>
      <span class="pct">${pct.toFixed(pct >= 99.95 ? 0 : 1)}%</span></div>
    <div class="bar"><i style="width:${pct}%;
      background:${COLOR[g.state] || "var(--dim)"}"></i></div>
    <div class="detail">${g.detail || ""} ${g.unit ? "&middot; " + g.unit : ""}</div>
  </div>`;
}
function statbar(label, used, total, fmt, color) {
  const pct = total > 0 ? Math.min(100, 100 * used / total) : 0;
  const c = color || (pct > 90 ? "var(--fail)"
                      : pct > 70 ? "var(--warn)" : "var(--run)");
  return `<div class="mini"><span>${label}</span><span>${fmt}</span></div>
    <div class="bar"><i style="width:${pct}%;background:${c}"></i></div>`;
}
function hostCard(h) {
  const gb = b => (b / 1073741824).toFixed(1);
  let s = `<div class="card"><div class="row"><b>${h.name}</b>
    <span class="pct">${h.cores} cores</span></div>`;
  s += statbar("CPU load (1 min)", h.load, h.cores,
               `${h.load.toFixed(1)} / ${h.cores}`);
  if (h.alloc != null)
    s += statbar("SLURM-allocated cores", h.alloc, h.alloc_total,
                 `${h.alloc} / ${h.alloc_total}`, "var(--ok)");
  s += statbar("Memory", h.mem_used, h.mem_total,
               `${gb(h.mem_used)} / ${gb(h.mem_total)} GB`);
  return s + "</div>";
}
async function load() {
  try {
    const r = await fetch("status.json?t=" + Date.now(), {cache: "no-store"});
    const s = await r.json();
    document.getElementById("when").textContent = s.updated;
    document.getElementById("jobs").innerHTML = s.gauges.map(jobCard).join("");
    document.getElementById("hosts").innerHTML =
      (s.hosts || []).map(hostCard).join("") ||
      "<div class='detail'>host stats unavailable</div>";
    document.getElementById("results").innerHTML =
      (s.results || []).map(x =>
        `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("");
  } catch (e) {
    document.getElementById("when").textContent =
      "status.json unavailable (" + e + ")";
  }
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
